-up workflow</text></g><g transform="translate(1264 174)"><rect width="74" height="104" rx="14" fill="#e2e8f0" stroke="#94a3b8"/><text x="37" y="67" font-size="13" font-weight="700" fill="#0f172a">Docker</text><text x="37" y="84" font-size="13" font-weight="700" fill="#0f172a">Compose</text></g></g><g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"><path d="M204 226h18M370 226h18M552 226h18M742 226h18M908 226h18M1074 226h18M1240 226h18"/></g><rect x="38" y="371" width="1324" height="102" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" stroke-dasharray="8 6"/><text x="62" y="404" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#9a3412">FUTURE ONLY · NOT DEPLOYED</text><path d="M503 438h123" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#future-arrow)"/><rect x="265" y="416" width="238" height="40" rx="10" fill="#fff" stroke="#fdba74"/><text x="384" y="441" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7c2d12">Validated local Compose</text><rect x="627" y="416" width="502" height="40" rx="10" fill="#ffedd5" stroke="#fb923c"/><text x="878" y="441" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7c2d12">AWS path: ECR · EC2 · EBS · CloudWatch</text></svg>
