<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="510" viewBox="0 0 1400 510" role="img" aria-labelledby="title description"><title id="title">Pharmacy renewal platform architecture</title><desc id="description">Synthetic data flows through feature engineering, leakage-safe temporal machine learning, a locked Logistic Regression model, MLflow, FastAPI, PostgreSQL, and Docker Compose. AWS is shown separately as a future-only deployment path.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#475569"/></marker><marker id="future-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#b45309"/></marker></defs><rect width="1400" height="510" rx="24" fill="#f8fafc"/><text x="56" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">System architecture</text><text x="56" y="82" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Validated local workflow · deterministic synthetic data only</text><rect x="38" y="105" width="1324" height="238" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="62" y="137" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#475569">VALIDATED LOCAL SYSTEM</text><g font-family="Arial,sans-serif" text-anchor="middle">
